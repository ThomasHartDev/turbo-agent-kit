apiVersion: v1
kind: Namespace
metadata:
  name: agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-server
  namespace: agent
data:
  PORT: "8787"
  REDIS_URL: redis://redis.agent.svc.cluster.local:6379
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-server
  namespace: agent
stringData:
  OPENAI_API_KEY: ""
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: agent
spec:
  serviceName: redis
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: [redis-cli, ping]
          readinessProbe:
            exec:
              command: [redis-cli, ping]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: server
          image: agent-server:local
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: agent-server
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-server
                  key: OPENAI_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: agent
spec:
  selector:
    app.kubernetes.io/name: server
  ports:
    - name: http
      port: 8787
      targetPort: http
